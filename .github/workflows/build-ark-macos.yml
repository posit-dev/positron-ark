name: "Ark Prebuild: macOS"

# Builds Ark for macOS, producing per-arch release archives for arm64 and x64.
# Unsigned/un-notarized: matches ark's current release behavior. Positron's
# own bundle signing re-signs the binary at app-build time, and install-kernel
# downloads over HTTP so no quarantine attribute is set on dev machines.
# Called from build-ark.yml.

on:
  workflow_call:
    inputs:
      ark_ref:
        required: true
        type: string
        description: "Ark git ref/SHA to build"
      version:
        required: false
        default: ""
        type: string
        description: "Public ark version, e.g. 0.1.251 (derived from ark_ref if omitted)"
      distance:
        required: false
        default: ""
        type: string
        description: "Commits since the public version tag (derived from ark_ref if omitted)"
      short_sha:
        required: false
        default: ""
        type: string
        description: "Short (7-char) SHA of the ark commit (derived from ark_ref if omitted)"
  workflow_dispatch:
    inputs:
      ark_ref:
        required: false
        default: "main"
        type: string
      version:
        required: false
        default: ""
        type: string
      distance:
        required: false
        default: ""
        type: string
      short_sha:
        required: false
        default: ""
        type: string

jobs:
  resolve:
    name: Resolve version inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      distance: ${{ steps.out.outputs.distance }}
      short_sha: ${{ steps.out.outputs.short_sha }}
    steps:
      # Skip checkout when the caller already passed all three values; the
      # parent build-ark.yml does, so the common path is a pure passthrough.
      - name: Checkout ark
        if: ${{ inputs.version == '' || inputs.distance == '' || inputs.short_sha == '' }}
        uses: actions/checkout@v4
        with:
          repository: posit-dev/ark
          ref: ${{ inputs.ark_ref }}
          fetch-depth: 0
      - name: Compute outputs
        id: out
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          DISTANCE='${{ inputs.distance }}'
          SHORT_SHA='${{ inputs.short_sha }}'
          if [ -z "$VERSION" ]; then
            VERSION=$(grep '^version' crates/ark/Cargo.toml | sed -e 's/[^.0-9]//g')
          fi
          if [ -z "$DISTANCE" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            DISTANCE=$(git rev-list --count "${LAST_TAG}..HEAD")
          fi
          if [ -z "$SHORT_SHA" ]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
          fi
          echo "version=${VERSION}"     | tee -a $GITHUB_OUTPUT
          echo "distance=${DISTANCE}"   | tee -a $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" | tee -a $GITHUB_OUTPUT

  build_macos:
    name: Build macOS ${{ matrix.arch }}
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        arch: [arm64, x64]
        include:
          - arch: arm64
            rust_target_prefix: aarch64
          - arch: x64
            rust_target_prefix: x86_64

    steps:
      - name: Checkout ark
        uses: actions/checkout@v4
        with:
          repository: posit-dev/ark
          ref: ${{ inputs.ark_ref }}

      - name: Configure environment
        run: grep -v '^#' .github/env/macos.env >> $GITHUB_ENV

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      # No x86 Homebrew is needed here: ark's `zmq-sys` builds libzmq from
      # vendored sources (via `zeromq-src`) and does not link libsodium, so
      # nothing under /usr/local is consulted during the build. The Homebrew
      # installer also refuses to run under Rosetta since Homebrew 7.0, which
      # broke this step in September 2026. Mirrors posit-dev/ark#1417.
      - name: Setup x86 cross-compiling
        if: matrix.arch == 'x64'
        run: rustup target add x86_64-apple-darwin

      - name: Compile ark
        env:
          npm_config_arch: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target_prefix }}-apple-darwin
          PKG_CONFIG_ALLOW_CROSS: 1
          ARK_BUILD_VERSION: ${{ needs.resolve.outputs.version }}+${{ needs.resolve.outputs.distance }}.${{ needs.resolve.outputs.short_sha }}
        run: |
          cargo clean
          cargo build --release --target ${{ matrix.rust_target_prefix }}-apple-darwin

      - name: Create per-arch archive
        run: |
          pushd target/${{ matrix.rust_target_prefix }}-apple-darwin/release
          ARCHIVE="$GITHUB_WORKSPACE/ark-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.distance }}-${{ needs.resolve.outputs.short_sha }}-darwin-${{ matrix.arch }}.zip"
          [ -e LICENSE ] || cp "$GITHUB_WORKSPACE/LICENSE" LICENSE
          [ -e NOTICE ] || cp "$GITHUB_WORKSPACE/crates/ark/NOTICE" NOTICE
          zip -Xry "$ARCHIVE" ark LICENSE NOTICE
          popd

      - name: Upload per-arch archive
        uses: actions/upload-artifact@v4
        with:
          name: ark-darwin-${{ matrix.arch }}-archive
          path: ark-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.distance }}-${{ needs.resolve.outputs.short_sha }}-darwin-${{ matrix.arch }}.zip

