name: "Ark Prebuild: Windows"

# Builds Ark for Windows (x64 + arm64), then signs the binaries via the
# shared posit-gh-actions Authenticode workflow. Called from build-ark.yml.

on:
  workflow_call:
    inputs:
      ark_ref:
        required: true
        type: string
        description: "Ark git ref/SHA to build"
      version:
        required: false
        default: ""
        type: string
        description: "Public ark version, e.g. 0.1.251 (derived from ark_ref if omitted)"
      distance:
        required: false
        default: ""
        type: string
        description: "Commits since the public version tag (derived from ark_ref if omitted)"
      short_sha:
        required: false
        default: ""
        type: string
        description: "Short (7-char) SHA of the ark commit (derived from ark_ref if omitted)"
  workflow_dispatch:
    inputs:
      ark_ref:
        required: false
        default: "main"
        type: string
      version:
        required: false
        default: ""
        type: string
      distance:
        required: false
        default: ""
        type: string
      short_sha:
        required: false
        default: ""
        type: string

jobs:
  resolve:
    name: Resolve version inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      distance: ${{ steps.out.outputs.distance }}
      short_sha: ${{ steps.out.outputs.short_sha }}
    steps:
      # Skip checkout when the caller already passed all three values; the
      # parent build-ark.yml does, so the common path is a pure passthrough.
      - name: Checkout ark
        if: ${{ inputs.version == '' || inputs.distance == '' || inputs.short_sha == '' }}
        uses: actions/checkout@v4
        with:
          repository: posit-dev/ark
          ref: ${{ inputs.ark_ref }}
          fetch-depth: 0
      - name: Compute outputs
        id: out
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          DISTANCE='${{ inputs.distance }}'
          SHORT_SHA='${{ inputs.short_sha }}'
          if [ -z "$VERSION" ]; then
            VERSION=$(grep '^version' crates/ark/Cargo.toml | sed -e 's/[^.0-9]//g')
          fi
          if [ -z "$DISTANCE" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            DISTANCE=$(git rev-list --count "${LAST_TAG}..HEAD")
          fi
          if [ -z "$SHORT_SHA" ]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
          fi
          echo "version=${VERSION}"     | tee -a $GITHUB_OUTPUT
          echo "distance=${DISTANCE}"   | tee -a $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" | tee -a $GITHUB_OUTPUT

  build_windows:
    name: Build Windows ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 40

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            runs_on: windows-latest
            rust_target_prefix: x86_64
          - arch: arm64
            runs_on: windows-11-arm
            rust_target_prefix: aarch64

    steps:
      - name: Checkout ark
        uses: actions/checkout@v4
        with:
          repository: posit-dev/ark
          ref: ${{ inputs.ark_ref }}

      - name: Compile ark
        env:
          RUST_TARGET: ${{ matrix.rust_target_prefix }}-pc-windows-msvc
          ARK_BUILD_VERSION: ${{ needs.resolve.outputs.version }}+${{ needs.resolve.outputs.distance }}.${{ needs.resolve.outputs.short_sha }}
        shell: cmd
        run: |
          cargo clean
          cargo build --release --target ${{ matrix.rust_target_prefix }}-pc-windows-msvc

      - name: Upload unsigned executable for signing
        uses: actions/upload-artifact@v4
        with:
          name: ark-windows-${{ matrix.arch }}-unsigned
          path: target\${{ matrix.rust_target_prefix }}-pc-windows-msvc\release\ark.exe

  sign_windows:
    name: Sign Windows binaries
    uses: posit-dev/posit-gh-actions/.github/workflows/sign-windows.yml@main
    needs: [build_windows]
    secrets: inherit
    strategy:
      matrix:
        arch: [x64, arm64]
    with:
      unsigned_artifact_name: ark-windows-${{ matrix.arch }}-unsigned
      signed_artifact_name: ark-windows-${{ matrix.arch }}-signed

  repackage_signed_windows:
    name: Repackage signed Windows ${{ matrix.arch }}
    runs-on: windows-latest
    needs: [resolve, sign_windows]
    timeout-minutes: 10

    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout ark
        uses: actions/checkout@v4
        with:
          repository: posit-dev/ark
          ref: ${{ inputs.ark_ref }}

      - name: Download signed executable
        uses: actions/download-artifact@v4
        with:
          name: ark-windows-${{ matrix.arch }}-signed
          path: signed

      - name: Create signed archive
        shell: pwsh
        run: |
          $params = @{
            Path = "signed\ark.exe", "LICENSE", "crates\ark\NOTICE"
            DestinationPath = "ark-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.distance }}-${{ needs.resolve.outputs.short_sha }}-windows-${{ matrix.arch }}.zip"
          }
          Compress-Archive @params

      - name: Upload signed archive
        uses: actions/upload-artifact@v4
        with:
          name: ark-windows-${{ matrix.arch }}-archive
          path: ark-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.distance }}-${{ needs.resolve.outputs.short_sha }}-windows-${{ matrix.arch }}.zip
