name: "Ark Prebuild: Linux"

# Builds Ark for Linux (x64 + arm64). Linked against an old glibc via
# cargo-zigbuild for broad distro compatibility, matching ark's own release
# workflow. Called from build-ark.yml.

on:
  workflow_call:
    inputs:
      ark_ref:
        required: true
        type: string
        description: "Ark git ref/SHA to build"
      version:
        required: true
        type: string
        description: "Public ark version, e.g. 0.1.251"
      distance:
        required: true
        type: string
        description: "Commits since the public version tag, e.g. 10"
  workflow_dispatch:
    inputs:
      ark_ref:
        required: false
        default: "main"
        type: string
      version:
        required: true
        type: string
      distance:
        required: true
        type: string

jobs:
  build_linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARCH_FLAG: ${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}
      GLIBC_MAX_VERSION: '2.26'

    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout ark
        uses: actions/checkout@v4
        with:
          repository: posit-dev/ark
          ref: ${{ inputs.ark_ref }}

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y cargo

          # Use the zig linker to pin glibc version
          cargo install --locked cargo-zigbuild
          sudo apt install python3-pip
          pip3 install ziglang

      - name: Setup arm64 cross target
        if: matrix.arch == 'arm64'
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Compile ark
        env:
          ARK_BUILD_VERSION: ${{ inputs.version }}+${{ inputs.distance }}
        run: |
          cargo clean
          cargo zigbuild --release \
            --target ${ARCH_FLAG}-unknown-linux-gnu.${GLIBC_MAX_VERSION}

      - name: Create archive
        run: |
          pushd target/${ARCH_FLAG}-unknown-linux-gnu/release
          ARCHIVE="$GITHUB_WORKSPACE/ark-${{ inputs.version }}-${{ inputs.distance }}-linux-${{ matrix.arch }}.zip"
          [ -e LICENSE ] || cp "$GITHUB_WORKSPACE/LICENSE" LICENSE
          [ -e NOTICE ] || cp "$GITHUB_WORKSPACE/crates/ark/NOTICE" NOTICE
          zip -Xry $ARCHIVE ark LICENSE NOTICE
          popd

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ark-linux-${{ matrix.arch }}-archive
          path: ark-${{ inputs.version }}-${{ inputs.distance }}-linux-${{ matrix.arch }}.zip
